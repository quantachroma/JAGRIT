version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: jagrit-db
    environment:
      POSTGRES_USER: jagrit_admin
      POSTGRES_PASSWORD: jagrit_password_2026
      POSTGRES_DB: jagrit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db-schema/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: